{% include base_path %}

<aside class="sidebar profile-panel" aria-label="Profile and academic links">
  <div class="profile-panel__identity">
    <a class="profile-panel__home" href="{{ base_path }}/" aria-label="{{ site.author.name }} home">
      <img
        class="profile-panel__portrait"
        src="{{ site.author.avatar | prepend: '/images/' | relative_url }}"
        alt="Portrait of {{ site.author.name | escape }}">
    </a>
    <div class="profile-panel__details">
      <a class="profile-panel__home" href="{{ base_path }}/">
        <span class="profile-panel__name">{{ site.author.name }}</span>
      </a>
      <p class="profile-panel__position">{{ site.author.position }}</p>
      <p class="profile-panel__affiliation">{{ site.author.employer }}</p>
    </div>
  </div>

  <nav class="profile-panel__links" aria-label="Academic profiles">
    <ul>
      {% if site.author.googlescholar %}
        <li><a href="{{ site.author.googlescholar }}">Google Scholar</a></li>
      {% endif %}
      {% if site.author.dblp %}
        <li><a href="{{ site.author.dblp }}">DBLP</a></li>
      {% endif %}
    </ul>
  </nav>
</aside>
